[extend]
useDefault = true

# Each entry names exact files or one exact value, so a secret anywhere
# else still fails the scan. Nothing in the listed test files is checked.

[[allowlists]]
description = "Fake keys the since-removed upload secret scanner was tested against; CI scans full history"
paths = [
  '''^packages/core/src/policy/secret-scan\.policy\.test\.ts$''',
  '''^packages/runtime/src/handlers/upload\.upload\.test\.ts$''',
  '''^apps/extension/src/handlers/upload\.upload\.test\.ts$''',
]

[[allowlists]]
description = "CoinGecko demo key: ships inside the extension bundle, so it is public by design"
regexes = ['''^CG-XG6hdjK9NPY2vfPVZQbAptqY$''']
