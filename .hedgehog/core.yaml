id: gleam-wallet
pattern: hexagonal
layers:
  - id: scaffold
    scope: ["packages/core/package.json", "packages/core/tsconfig.json", "packages/messaging/package.json", "packages/messaging/tsconfig.json", "packages/ui/src/tokens/**", "packages/ui/src/primitives/**", "packages/ui/package.json", "apps/extension/wxt.config.ts", "apps/extension/tsconfig.json", "apps/extension/package.json", "package.json", "pnpm-workspace.yaml", ".eslintrc.cjs", "apps/extension/entrypoints/popup/index.tsx", "apps/extension/entrypoints/sidepanel/index.tsx", "apps/extension/src/App.tsx"]
    verify: "pnpm install --frozen-lockfile && pnpm eslint packages apps --max-warnings=0 && pnpm wxt build && pnpm vitest run scaffold ui"
    commit: "feat(gleam): scaffold"
    requires: ["pnpm"]
  - id: messaging
    depends_on: scaffold
    scope: ["packages/messaging/src/**", "packages/core/src/models/**", "packages/core/src/ports/windows.ts", "packages/core/src/ports/runtime.ts", "packages/core/src/ports/ports.models.test.ts", "packages/core/src/index.ts"]
    verify: "pnpm vitest run messaging models && pnpm tsc -p packages/messaging --noEmit && pnpm tsc -p packages/core --noEmit"
    verify_radius: ["packages/messaging/**", "packages/core/**"]
    commit: "feat(gleam): messaging"
  - id: vault
    depends_on: messaging
    scope: ["packages/core/src/vault/**", "packages/core/src/keys/**", "packages/core/src/ports/storage.ts"]
    verify: "pnpm vitest run vault keys && pnpm tsc -p packages/core --noEmit"
    commit: "feat(gleam): vault"
  - id: onboarding-unlock
    depends_on: vault
    scope: ["apps/extension/entrypoints/popup/onboarding/**", "apps/extension/entrypoints/popup/unlock/**", "apps/extension/src/handlers/wallet-lifecycle.ts", "apps/extension/src/handlers/wallet-lifecycle.onboarding.test.ts", "apps/extension/src/adapters/storage.ts", "apps/extension/src/adapters/storage.unlock.test.ts", "apps/extension/src/adapters/runtime.ts", "apps/extension/src/adapters/runtime.unlock.test.ts", "packages/ui/src/components/onboarding/**", "packages/core/src/index.ts"]
    verify: "pnpm vitest run onboarding unlock && pnpm tsc -p packages/core --noEmit && pnpm wxt build"
    verify_radius: ["apps/extension/**", "packages/ui/src/components/onboarding/**", "packages/core/**"]
    commit: "feat(gleam): onboarding and unlock"
  - id: wallet-core
    depends_on: onboarding-unlock
    scope: ["packages/core/src/arweave/**", "packages/core/src/ao/**", "packages/core/src/pricing/**", "packages/core/src/activity/**", "apps/extension/entrypoints/popup/main-screen/**", "apps/extension/entrypoints/popup/send/**", "apps/extension/entrypoints/popup/receive/**", "apps/extension/entrypoints/popup/activity/**", "apps/extension/src/handlers/reads.ts", "apps/extension/src/handlers/reads.activity.test.ts", "apps/extension/src/handlers/transfer.ts", "apps/extension/src/handlers/transfer.send.test.ts", "packages/ui/src/components/wallet/**", "apps/extension/src/App.tsx"]
    verify: "pnpm vitest run arweave ao pricing activity send receive && pnpm tsc -p packages/core --noEmit && pnpm wxt build"
    verify_radius: ["packages/core/**", "apps/extension/**", "packages/ui/src/components/wallet/**"]
    commit: "feat(gleam): wallet core (balances, send, receive, activity)"
  - id: upload
    depends_on: wallet-core
    scope: ["packages/core/src/policy/**", "apps/extension/entrypoints/popup/upload/**", "apps/extension/src/handlers/upload.ts", "apps/extension/src/handlers/upload.upload.test.ts"]
    verify: "pnpm vitest run policy upload"
    commit: "feat(gleam): upload"
  - id: provider-bridge
    depends_on: upload
    scope: ["apps/extension/entrypoints/content/**", "apps/extension/entrypoints/provider/**", "apps/extension/entrypoints/approval/**", "apps/extension/entrypoints/background/**", "apps/extension/src/handlers/approval.ts", "apps/extension/src/handlers/approval.approval.test.ts", "apps/extension/src/adapters/windows.ts", "apps/extension/src/adapters/windows.provider.test.ts", "apps/extension/entrypoints/popup/connected-apps/**", "packages/messaging/src/protocol.ts", "packages/core/src/models/grant.ts", "packages/core/src/models/transfer.ts", "packages/core/src/models/upload.ts"]
    verify: "pnpm vitest run provider bridge approval connected-apps content/index background/index && pnpm tsc -p packages/messaging --noEmit && pnpm tsc -p packages/core --noEmit && pnpm wxt build"
    verify_radius: ["apps/extension/**", "packages/messaging/**", "packages/core/**"]
    commit: "feat(gleam): injected provider, connection approval, signing approval"
  - id: settings-screens-gap
    depends_on: provider-bridge
    scope: ["packages/messaging/src/protocol.ts", "apps/extension/src/handlers/reads.ts", "apps/extension/src/handlers/reads.activity.test.ts", "apps/extension/src/handlers/wallet-lifecycle.ts", "apps/extension/src/handlers/wallet-lifecycle.onboarding.test.ts", "apps/extension/entrypoints/popup/wallet-switcher/**", "apps/extension/entrypoints/popup/lock-settings/**", "apps/extension/entrypoints/popup/network-peers/**", "apps/extension/entrypoints/popup/send/**", "apps/extension/entrypoints/popup/receive/**", "apps/extension/entrypoints/popup/upload/**", "apps/extension/entrypoints/popup/connected-apps/**", "apps/extension/entrypoints/popup/main-screen/**", "packages/ui/src/components/wallet/**", "packages/ui/src/components/onboarding/index.ts"]
    verify: "pnpm vitest run wallet-switcher lock-settings network-peers send receive upload connected-apps main-screen reads onboarding-unlock && pnpm tsc -p packages/messaging --noEmit && pnpm tsc -p packages/core --noEmit && pnpm wxt build"
    verify_radius: ["packages/messaging/**", "apps/extension/**", "packages/ui/src/components/**"]
    commit: "feat(gleam): wallet switcher, lock settings, network peers screens + cross-cutting loading/error states"
  - id: historical-pricing
    depends_on: settings-screens-gap
    scope: ["packages/core/src/pricing/**"]
    verify: "pnpm vitest run pricing && pnpm tsc -p packages/core --noEmit"
    commit: "feat(gleam): historical portfolio-value pricing"
  - id: main-screen-chart
    depends_on: historical-pricing
    scope: ["apps/extension/entrypoints/popup/main-screen/**", "packages/ui/src/components/wallet/**", "packages/ui/src/tokens/**", "apps/extension/package.json", "pnpm-lock.yaml"]
    verify: "pnpm vitest run main-screen pricing && pnpm tsc -p packages/core --noEmit && pnpm wxt build"
    verify_radius: ["apps/extension/**", "packages/ui/src/components/**", "packages/ui/src/tokens/**", "packages/core/**", "pnpm-lock.yaml"]
    commit: "feat(gleam): main-screen portfolio chart, range tabs, account avatar"
  - id: session-key-persistence
    depends_on: main-screen-chart
    scope: ["apps/extension/src/handlers/key-session.ts", "apps/extension/src/handlers/key-session.session.test.ts", "apps/extension/src/handlers/wallet-lifecycle.ts", "apps/extension/src/handlers/wallet-lifecycle.onboarding.test.ts", "apps/extension/src/handlers/transfer.ts", "apps/extension/src/handlers/transfer.send.test.ts", "apps/extension/src/handlers/upload.ts", "apps/extension/src/handlers/upload.upload.test.ts", "apps/extension/src/handlers/approval.ts", "apps/extension/src/handlers/approval.approval.test.ts"]
    verify: "pnpm vitest run key-session onboarding-unlock send upload approval && pnpm tsc -p packages/core --noEmit && pnpm wxt build"
    verify_radius: ["apps/extension/**"]
    commit: "fix(gleam): persist unlocked signing keys across service-worker restarts"
