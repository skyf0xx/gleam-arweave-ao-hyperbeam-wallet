<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Only bundled scripts run. connect-src stays scheme-wide because users
      add their own gateways and HyperBEAM peers; 'wasm-unsafe-eval' is for
      Argon2id (hash-wasm), as in the extension's CSP (apps/extension/src/csp.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Gleam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
