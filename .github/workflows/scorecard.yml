name: Scorecard

# Publishes the OpenSSF Scorecard result behind the README badge. With
# publish_results the action only accepts an allowlist of steps, so this
# workflow stays separate from ci.yml.
on:
  push:
    branches: [master]
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2"

permissions: read-all

jobs:
  # Scorecard counts the Gradle wrapper jar as validated only once ci.yml
  # has a successful run on the commit it scores, and both start on the same
  # push, so a push waits for that run. The analysis runs either way.
  wait-for-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            state=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --event push \
              --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::warning::CI on $SHA finished as $state"; exit 0 ;;
            esac
            sleep 30
          done
          echo "::warning::CI on $SHA was still running after 40 minutes"

  analysis:
    needs: wait-for-ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
