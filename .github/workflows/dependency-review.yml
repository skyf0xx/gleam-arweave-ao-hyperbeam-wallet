name: Dependency review

# Only pull_request: the action diffs the PR's base against its head, so it
# has nothing to compare on a push.
on: pull_request

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Copyleft that would end up in the extension bundle. No runtime
          # dependency uses LGPL today, so it isn't denied or allowed here.
          deny-licenses: >-
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later
          # fastlane's highline and rdoc are "GPL-2.0-only OR Ruby", used under
          # Ruby. They run only on the machine that uploads the app and ship in
          # no bundle. node-forge is "BSD-3-Clause OR GPL-2.0", used under BSD,
          # and reaches only web-ext, a dev tool.
          allow-dependencies-licenses: pkg:gem/highline, pkg:gem/rdoc, pkg:npm/node-forge
          # elliptic (GHSA-848j-6mx2-7j84) has no patched release, so a PR
          # touching it would fail forever. Drop each ID once its package has
          # a fix.
          allow-ghsas: GHSA-848j-6mx2-7j84
