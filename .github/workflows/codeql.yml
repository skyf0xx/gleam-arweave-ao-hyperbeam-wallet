name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Kotlin extracts without a Gradle build; Swift can't, so it has its own job.
        language: [actions, javascript-typescript, java-kotlin]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # The dApp view plugin is a trust boundary, but it only compiles inside the
  # app: on its own, SwiftPM can't resolve Capacitor's Cordova module. So this
  # builds the whole app, which needs the web bundle and `cap sync` first.
  # Tracing the full build (every Capacitor plugin, SQLCipher's C) took ~20
  # minutes, so dependencies build untraced and only our own Swift is rebuilt
  # under CodeQL.
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:build
      - run: pnpm --filter @gleam/mobile exec cap sync ios
      - run: >-
          xcodebuild
          -project apps/mobile/ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - run: >-
          find apps/mobile/ios/App/App apps/mobile/plugins
          -name '*.swift' -not -name Package.swift
          -not -path '*/node_modules/*' -not -path '*/.build/*'
          -exec touch {} +
      # Packages resolved in the untraced build; resolving again under the
      # tracer took 7+ minutes.
      - run: >-
          xcodebuild
          -project apps/mobile/ios/App/App.xcodeproj
          -scheme App
          -destination 'generic/platform=iOS Simulator'
          -disableAutomaticPackageResolution
          -skipPackageUpdates
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
