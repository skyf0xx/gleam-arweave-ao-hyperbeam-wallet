name: Release

# pnpm release --yes pushes a signed tag v<version>; this builds that commit,
# attests the extension zip, hashes the mobile apps' web bundle into the
# manifest and publishes it all as a GitHub Release. The Chrome Web Store
# and app store uploads stay manual, so no store credentials live in CI.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Read-only: dependency install scripts run here, so this job gets no
  # write token and no OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      commit: ${{ steps.verify.outputs.commit }}
      built-at: ${{ steps.verify.outputs.built-at }}
      zip-name: ${{ steps.zip.outputs.zip-name }}
      zip-sha256: ${{ steps.zip.outputs.zip-sha256 }}
      mobile-bundle-sha256: ${{ steps.mobile.outputs.bundle-sha256 }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Unverified until the first tagged release runs. If a step fails on
          # a blocked call, set egress-policy to audit and read the run's
          # network insights to find the missing endpoint.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            fulcio.githubapp.com:443
            timestamp.githubapp.com:443
            tuf-repo.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag, signature, branch and version
        id: verify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "tag $TAG is not v<major>.<minor>.<patch>"

          # checkout can leave the pushed tag as a lightweight ref to the
          # commit; fetch the real tag object so its signature can be read.
          git fetch --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || fail "$TAG is not an annotated tag"

          git -c gpg.ssh.allowedSignersFile=.github/allowed_signers tag -v "$TAG" \
            || fail "$TAG is not signed by a key in .github/allowed_signers"

          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$commit" = "$(git rev-parse HEAD)" ] || fail "checked-out HEAD is not the commit $TAG points to ($commit)"

          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          git merge-base --is-ancestor "$commit" origin/master || fail "$commit is not on master"

          version="$(node -p 'require("./apps/extension/package.json").version')"
          [ "v$version" = "$TAG" ] || fail "tag $TAG does not match apps/extension/package.json version $version"

          node scripts/app-versions.mjs --check "$version" \
            || fail "extension, mobile, iOS and Android versions do not all match $version"

          # The same gate pnpm release runs, so tagging by hand doesn't skip it.
          node scripts/release-gate.mjs || fail "release gate failed for $TAG (see output above)"

          # Commit time, not wall-clock time, so the manifest is reproducible.
          built_at="$(TZ=UTC git show -s --date=iso-strict-local --format=%cd "$commit")"

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "commit=$commit"
            echo "built-at=$built_at"
          } >> "$GITHUB_OUTPUT"

      # No dependency cache: a cache written by another run must not feed
      # a release build.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gleam/extension exec wxt zip
      - run: pnpm mobile:build

      - name: Hash the zip
        id: zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(apps/extension/.output/*-chrome.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "::error::expected one *-chrome.zip, found ${#zips[@]}"; exit 1; }
          name="$(basename "${zips[0]}")"
          sha="$(sha256sum "${zips[0]}" | cut -d' ' -f1)"
          echo "$sha  $name"
          {
            echo "zip-name=$name"
            echo "zip-sha256=$sha"
          } >> "$GITHUB_OUTPUT"

      # The hash scripts/verify-bundle.mjs recomputes before the apps are signed.
      - name: Hash the mobile web bundle
        id: mobile
        run: |
          set -euo pipefail
          sha="$(node apps/mobile/scripts/bundle-hash.mjs apps/mobile/dist)"
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bundle hash is not 64 hex characters: $sha"; exit 1; }
          echo "mobile bundle $sha"
          echo "bundle-sha256=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: apps/extension/.output/${{ steps.zip.outputs.zip-name }}
          if-no-files-found: error
          retention-days: 7

  # Runs no repository code: it only attests and publishes the built zip.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # Unverified until the first tagged release runs. If a step fails on
          # a blocked call, set egress-policy to audit and read the run's
          # network insights to find the missing endpoint.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            token.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            fulcio.githubapp.com:443
            timestamp.githubapp.com:443
            tuf-repo.github.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist

      - name: Check the zip is the one that was built
        env:
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
          ZIP_SHA256: ${{ needs.build.outputs.zip-sha256 }}
        run: echo "$ZIP_SHA256  dist/$ZIP_NAME" | sha256sum -c -

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ needs.build.outputs.zip-name }}

      - name: Write release-manifest.json and notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT: ${{ needs.build.outputs.commit }}
          BUILT_AT: ${{ needs.build.outputs.built-at }}
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
          ZIP_SHA256: ${{ needs.build.outputs.zip-sha256 }}
          MOBILE_BUNDLE_SHA256: ${{ needs.build.outputs.mobile-bundle-sha256 }}
          ATTESTATION: ${{ steps.attest.outputs.attestation-url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg commit "$COMMIT" \
            --arg zipName "$ZIP_NAME" \
            --arg zipSha256 "$ZIP_SHA256" \
            --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg mobileBundleSha256 "$MOBILE_BUNDLE_SHA256" \
            --arg builtAt "$BUILT_AT" \
            --arg attestation "$ATTESTATION" \
            '{version: $version, tag: $tag, commit: $commit, zipName: $zipName, zipSha256: $zipSha256, mobileBundleSha256: $mobileBundleSha256, workflowRun: $workflowRun, builtAt: $builtAt, attestation: $attestation}' \
            > dist/release-manifest.json
          cat dist/release-manifest.json

          cat > dist/notes.md <<EOF
          Gleam $TAG, built from $COMMIT.

          SHA-256 of \`$ZIP_NAME\`: \`$ZIP_SHA256\`

          ## Verify this release

          Download \`$ZIP_NAME\` and \`release-manifest.json\`, then check the zip's hash against the manifest:

          \`\`\`bash
          sha256sum $ZIP_NAME
          jq -r .zipSha256 release-manifest.json
          \`\`\`

          Check that GitHub Actions built it from this repository:

          \`\`\`bash
          gh attestation verify $ZIP_NAME --repo $REPO
          \`\`\`

          Build provenance: $ATTESTATION

          ## Mobile apps

          SHA-256 of the apps' web bundle: \`$MOBILE_BUNDLE_SHA256\`

          To compare it with an Android APK, unzip the APK and run this from a checkout of \`$TAG\`:

          \`\`\`bash
          node apps/mobile/scripts/bundle-hash.mjs <unzipped-apk>/assets/public --exclude cordova.js --exclude cordova_plugins.js
          \`\`\`

          The native shell is not reproducible, because the stores re-sign it. The apps can reach the stores a day or two after the extension, since store review takes time.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
        run: |
          gh release create "$TAG" \
            "dist/$ZIP_NAME" dist/release-manifest.json \
            --verify-tag \
            --latest \
            --title "Gleam $TAG" \
            --notes-file dist/notes.md
