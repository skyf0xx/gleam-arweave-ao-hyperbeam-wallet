name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether a pull request changes only files that no check reads:
  # prose, the branding sources under docs/branding and editor settings.
  # The jobs below skip only on an explicit "false": if this job fails, its
  # output is empty and every check runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request checks out its merge commit, so HEAD^1 is the base.
      # Tests read docs/THREAT_MODEL.md, security/scan/REPORT.md and the PR
      # template, so Markdown under security/ or .github/ counts as code.
      # docs/branding holds images and HTML mock-ups that nothing imports.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code=false
          if [ "$EVENT" != pull_request ]; then
            code=true
          else
            git diff --name-only HEAD^1 HEAD > changed.txt
            [ -s changed.txt ] || code=true
            while IFS= read -r path; do
              case "$path" in
                security/*|.github/*|docs/THREAT_MODEL.md) code=true ;;
                *.md|docs/branding/*|LICENSE|.vscode/*) ;;
                *) code=true ;;
              esac
            done < changed.txt
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  workflow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on findings instead of uploading SARIF, which would
          # need security-events: write.
          advanced-security: false
          version: 1.30.1

  # The pre-commit hook can be skipped with --no-verify; this can't.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner

  # The committed gradle-wrapper.jar runs during every Android build, so check
  # it against the checksums Gradle publishes for its releases.
  gradle-wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  lint-and-typecheck:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eslint --max-warnings=0 .
      - run: pnpm deps:check
      - run: pnpm tsc -p packages/core --noEmit
      - run: pnpm tsc -p packages/messaging --noEmit
      - run: pnpm tsc -p packages/ui --noEmit
      - run: pnpm tsc -p packages/runtime --noEmit
      - run: pnpm tsc -p packages/app --noEmit
      - run: pnpm tsc -p packages/provider --noEmit
      - run: pnpm tsc -p packages/keystone --noEmit
      - run: pnpm tsc -p apps/extension --noEmit
      - run: pnpm tsc -p apps/mobile --noEmit
      - run: pnpm tsc -p apps/points-api --noEmit
      - run: pnpm tsc -p scripts/scan --noEmit
      - run: pnpm tsc -p tsconfig.scripts.json --noEmit

  test-shard:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A real server for the points-api tests that PGlite's single connection can't run (scan races).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --shard=${{ matrix.shard }}/4

  # The required check. It passes only when every shard passed, or when the
  # shards were skipped because the pull request changes only prose.
  test:
    runs-on: ubuntu-latest
    needs: [changes, test-shard]
    if: ${{ !cancelled() }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - env:
          SHARDS: ${{ needs.test-shard.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "shards: $SHARDS, code: $CODE"
          [ "$SHARDS" = success ] || { [ "$SHARDS" = skipped ] && [ "$CODE" = false ]; }

  build-extension:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wxt:build
      # The keyring page holds only key code; provider.js and the content
      # script stay small and free of new npm packages.
      - run: pnpm check:bundles

      # web-ext checks the build against Firefox's rules. Two of its errors are
      # Firefox-only manifest requirements that a Chrome MV3 build can't
      # meet, so they are dropped here; any other error fails the job.
      # Warnings are listed but don't fail it.
      - name: Lint the build with web-ext
        run: |
          set -euo pipefail
          # pnpm appends its own failure text to stdout when web-ext exits
          # non-zero, so keep only the JSON line.
          { pnpm --filter @gleam/extension exec web-ext lint \
              --source-dir .output/chrome-mv3 --output json --no-config-discovery || true; } \
            | grep '^{' > web-ext.json
          jq -e '.errors | type == "array"' web-ext.json > /dev/null
          jq -r '.warnings[] | "warning \(.code) \(.file // "") \(.message)"' web-ext.json
          jq -r '.errors[]
            | select(.code != "BACKGROUND_SERVICE_WORKER_NOFALLBACK" and .code != "ADDON_ID_REQUIRED")
            | "::error::web-ext \(.code) \(.file // "") \(.message)"' web-ext.json | tee web-ext-errors.txt
          [ ! -s web-ext-errors.txt ]

      - run: pnpm mobile:build
      # wxt:build passing doesn't mean the bundle runs; load it in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke

  security-scan:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No install or build: osv-scanner reads the lockfile and Semgrep
      # ignores node_modules and .output (.semgrepignore).
      - name: Install osv-scanner 2.6.0
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - run: ./osv-scanner scan --config osv-scanner.toml --lockfile pnpm-lock.yaml

      # Semgrep 1.180.0. Not run as the root container user: the checkout is
      # owned by the runner user, which git refuses to read as root.
      - name: Semgrep
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 \
            semgrep scan --metrics=off --error \
              --config p/typescript --config p/javascript --config p/react --config p/secrets
