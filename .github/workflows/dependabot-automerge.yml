name: Dependabot auto-merge

# Plain pull_request, not pull_request_target: Dependabot's runs still get
# the write permissions granted below, and no other fork PR does.
on: pull_request

permissions: {}

jobs:
  automerge:
    # The PR author, not github.actor: actor is whoever triggered this run,
    # which can be Dependabot on a PR someone else opened.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Only patch/minor updates to non-major semver, and never a security
      # advisory for a package with no patched version — those still need a
      # human to pick the fix (see elliptic/GHSA-848j-6mx2-7j84).
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Merge commit: the master ruleset requires signed commits and allows
      # only merge commits. GitHub signs the merge commit, and Dependabot's
      # own commit keeps its signature. GitHub can't sign rebase merges.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
