version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Hold new releases back a week so a hijacked version is usually pulled
    # before Dependabot proposes it (and auto-merge ships it).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Bundler, extension framework and their plugins arrive together in a
      # clearly labelled PR instead of hiding inside an unrelated bump (a
      # plugin-react bump once pulled in Vite 8 and broke the built popup).
      # Listed before npm-minor-patch because a dependency joins the first
      # group it matches. A major in this group needs the manual Chrome
      # check (load .output/chrome-mv3 unpacked) before merging.
      build-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - wxt
          - "@wxt-dev/*"
          - rolldown
          - "@tailwindcss/vite"
          - vite-plugin-node-polyfills
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps)

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(ci)
