<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for apps/site/img/og-gleam.jpg (1200×630). Serve the repo root, open this file at 1200×630 and screenshot it as JPEG. -->
<link rel="stylesheet" href="../../apps/site/styles.css">
<link rel="stylesheet" href="../../apps/site/program.css">
<link rel="stylesheet" href="../../apps/site/gleam.css">
<link rel="stylesheet" href="og-program.css">
<style>
  .og::before { -webkit-mask-image: radial-gradient(ellipse 55% 70% at 85% 85%, #000, transparent 75%); mask-image: radial-gradient(ellipse 55% 70% at 85% 85%, #000, transparent 75%); }
  .copy { top: 140px; width: 1060px; }
  .copy h1 { font-size: 100px; line-height: .98; letter-spacing: -0.05em; }
  .copy h1 .gw {
    background: linear-gradient(100deg, #fff 30%, color-mix(in oklab, var(--beam-purple) 45%, #fff) 50%, color-mix(in oklab, var(--beam-sky) 45%, #fff) 64%, #fff 80%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .copy p { margin-top: 24px; max-width: none; }
  .run { position: absolute; left: 0; right: 330px; bottom: 96px; height: 10px; flex-direction: column; width: auto;
    -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent); mask-image: linear-gradient(90deg, #000 70%, transparent); }
  .run::after { content: ""; position: absolute; right: 34%; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 14px 4px rgba(255, 255, 255, .6), 0 0 44px 12px rgba(115, 201, 232, .4); }
  .count { position: absolute; right: 80px; bottom: 40px; display: flex; align-items: flex-end; gap: .1em; font-size: 168px; font-weight: 760; line-height: 1; letter-spacing: -0.055em; }
  .count .side { display: flex; flex-direction: column; padding-bottom: .1em; letter-spacing: -0.02em; }
  .count .dec { font-size: .3em; line-height: 1; color: var(--on-ink-muted); }
  .count .unit { margin-top: .5em; font-size: .1em; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--on-ink-muted); }
</style></head>
<body class="program"><div class="og">
  <span class="wordmark"><img src="../../apps/site/favicon.svg" alt="">gleam</span>
  <div class="copy">
    <h1>Your AO is idle.<br>Make it earn <span class="gw">GLEAM</span>.</h1>
    <p>Hold AR and AO. Stake GLEAM. <b>Unlock the permaweb.</b></p>
  </div>
  <div class="beam run"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="count"><span>128</span><span class="side"><span class="dec">.60</span><span class="unit">points</span></span></div>
</div></body></html>
