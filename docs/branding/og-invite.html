<!doctype html>
<html lang="en" class="js"><head><meta charset="utf-8">
<!-- Source for apps/site/img/og-invite.jpg (1200×630). Serve the repo root, open this file at 1200×630 and screenshot it as JPEG. -->
<link rel="stylesheet" href="../../apps/site/styles.css">
<link rel="stylesheet" href="../../apps/site/program.css">
<link rel="stylesheet" href="../../apps/site/invite.css">
<link rel="stylesheet" href="og-program.css">
<style>
  .ticket { position: absolute; right: 92px; top: 150px; width: 400px; margin: 0; transform: rotate(-5deg); }
  .ticket-stamp { opacity: 1; top: auto; bottom: 36px; right: 20px; font-size: 1.25rem; }
  .ticket-code { font-size: 3.75rem; letter-spacing: .06em; }
</style></head>
<body class="program"><div class="og">
  <span class="wordmark"><img src="../../apps/site/favicon.svg" alt="">gleam</span>
  <div class="copy">
    <div class="beam stack"><span></span><span></span><span></span><span></span><span></span></div>
    <h1>Get in<br>early.</h1>
    <p>Gleam is invite-only.<br><b>Someone saved you a seat.</b></p>
  </div>
  <div class="ticket">
    <div class="ticket-top">
      <span class="ticket-kicker">Gleam invite</span>
      <span class="ticket-mark"><img src="../../apps/site/favicon.svg" alt="" width="18" height="18"></span>
    </div>
    <span class="ticket-code"><span>•</span><span>•</span><span>•</span><span>•</span><span>•</span><span>•</span></span>
    <div class="ticket-seats">
      <i class="open" style="--c: var(--beam-red)"></i><i class="open" style="--c: var(--beam-purple)"></i><i class="open" style="--c: var(--beam-sky)"></i><i class="open" style="--c: var(--beam-yellow)"></i><i class="open" style="--c: var(--beam-green)"></i><i></i><i></i>
    </div>
    <span class="ticket-stamp">Invite only</span>
    <div class="ticket-beam"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div></body></html>
