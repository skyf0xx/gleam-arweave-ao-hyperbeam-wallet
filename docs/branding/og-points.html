<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for apps/site/img/og-points.jpg (1200×630). Serve the repo root, open this file at 1200×630 and screenshot it as JPEG. -->
<link rel="stylesheet" href="../../apps/site/styles.css">
<link rel="stylesheet" href="../../apps/site/program.css">
<link rel="stylesheet" href="../../apps/site/points.css">
<link rel="stylesheet" href="og-program.css">
<style>
  .copy h1 { font-size: 96px; }
  .dial { --p: .72; position: absolute; right: 64px; top: 85px; width: 460px; margin: 0; }
  .dial-time { font-size: 6.5rem; margin: 4px 0 10px; }
  .dial-label { font-size: 1rem; }
  .dial-sub { font-size: .9375rem; }
</style></head>
<body class="program"><div class="og">
  <span class="wordmark"><img src="../../apps/site/favicon.svg" alt="">gleam</span>
  <div class="copy">
    <div class="beam stack"><span></span><span></span><span></span><span></span><span></span></div>
    <h1>Earn by<br>using Gleam.</h1>
    <p>Your AR and AO earn points every day.<br><b>+10% for every friend you bring.</b></p>
  </div>
  <div class="dial">
    <div class="dial-ring"></div>
    <div class="dial-head"></div>
    <div class="dial-face">
      <span class="dial-label">Points per day</span>
      <span class="dial-time">+1</span>
      <span class="dial-sub">per AR or AO you hold</span>
    </div>
  </div>
</div></body></html>
