<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../apps/site/styles.css">
<!-- Source for apps/site/img/og.jpg (1200×630). Serve the repo root, open this file at 1200×630 and screenshot it as JPEG. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .card { position: relative; width: 1200px; height: 630px; }
  .text { position: absolute; left: 88px; top: 50%; transform: translateY(-50%); width: 560px; }
  .text .wordmark { font-size: 1.75rem; gap: 12px; }
  .text .wordmark img { width: 30px; height: 30px; }
  .text h1 { margin: 44px 0 0; font-weight: 600; font-size: 76px; line-height: 1.02; letter-spacing: -0.035em; color: var(--fg); }
  .text .beam { margin-top: 32px; width: 96px; height: 4px; }
  .text p { margin: 28px 0 0; font-size: 24px; color: var(--muted); }
  .shot { position: absolute; right: 40px; top: -40px; width: 520px; }
  .shot img { width: 100%; -webkit-mask-image: radial-gradient(closest-side, #000 80%, transparent 100%); mask-image: radial-gradient(closest-side, #000 80%, transparent 100%); }
</style></head>
<body><div class="card">
  <div class="text">
    <span class="wordmark"><img src="../../apps/site/favicon.svg" alt="">gleam</span>
    <h1>Crypto without the clutter.</h1>
    <div class="beam"><span></span><span></span><span></span><span></span><span></span></div>
    <p>Your wallet for AO and Arweave.</p>
  </div>
  <div class="shot"><img src="../../apps/site/img/dashboard-hero-1004.webp" alt=""></div>
</div></body></html>
