packages:
  - "apps/*"
  - "packages/*"
  - "apps/mobile/plugins/*"
allowBuilds:
  esbuild: true
  keccak: true
  lefthook: true
  secp256k1: true
overrides:
  elliptic: ^6.6.1
  secp256k1: ^5.0.1
  "@ethersproject/providers>ws": ^7.5.11
  jsdom>ws: ^8.21.3
  image-size: ^2.0.3
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12
  source-map-js: ^1.2.2
  shell-quote: ^1.11.0
  pbkdf2: ^3.1.7
  "@keystonehq/bc-ur-registry-arweave>uuid": ^11.1.1
  xcode>uuid: ^11.1.1
  vite: ^8.3.3
  node-forge: ^1.4.2
# Hijacked npm releases are usually caught and pulled within a day or two;
# refusing anything younger than 3 days keeps them out of the lockfile.
# Setting it explicitly also makes pnpm fail instead of auto-excluding.
minimumReleaseAge: 4320
# Fail when a version was published with weaker provenance than an earlier
# one, the usual sign of a stolen npm token.
trustPolicy: no-downgrade
trustPolicyExclude:
  # 6.3.1 is a ReDoS backport published without provenance after 7.x had it.
  - semver@6.3.1
