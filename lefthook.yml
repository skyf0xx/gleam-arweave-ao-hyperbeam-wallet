pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm eslint --max-warnings=0 {staged_files}

    - name: gitleaks
      run: >
        command -v gitleaks >/dev/null || { echo "gitleaks is missing: brew install gitleaks"; exit 1; };
        gitleaks git --pre-commit --staged --redact --verbose --no-banner

    - name: tsc
      glob: "*.{ts,tsx}"
      run: >
        pnpm tsc -p packages/core --noEmit &&
        pnpm tsc -p packages/messaging --noEmit &&
        pnpm tsc -p packages/ui --noEmit &&
        pnpm tsc -p packages/runtime --noEmit &&
        pnpm tsc -p packages/app --noEmit &&
        pnpm tsc -p packages/provider --noEmit &&
        pnpm tsc -p packages/keystone --noEmit &&
        pnpm tsc -p apps/extension --noEmit &&
        pnpm tsc -p apps/mobile --noEmit &&
        pnpm tsc -p apps/points-api --noEmit &&
        pnpm tsc -p scripts/scan --noEmit
